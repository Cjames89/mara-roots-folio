# No build step. The repo root now contains only site files, so it is safe to
# publish directly. Internal docs live in .github/, which Netlify does not
# serve, and dotfiles are excluded automatically.
#
# This deliberately has no build command: a build command is the single
# largest failure surface here, and an empty one cannot fail. If Netlify's
# UI has a stale command set (the pre-rebuild config ran "npm install &&
# npm run build"), the UI overrides this file and the deploy fails. Clear
# the Build command and Publish directory fields in the Netlify UI so this
# file governs.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# HTML must revalidate so copy edits appear immediately after a deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Static assets cache for a week. Deliberately not "immutable": these
# filenames are stable, so a swapped favicon or resume must still expire.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/resume.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"
