name: Publish site to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild gh-pages from main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          SITE_FILES="index.html headshot.jpg favicon.png resume.pdf robots.txt sitemap.xml netlify.toml"

          rm -rf /tmp/site
          mkdir -p /tmp/site

          missing=0
          for f in $SITE_FILES; do
            if [ -e "$f" ]; then
              cp "$f" /tmp/site/
            else
              echo "::warning::site file missing from main: $f"
              missing=1
            fi
          done

          if [ ! -e /tmp/site/index.html ]; then
            echo "::error::index.html is missing; refusing to publish an empty site"
            exit 1
          fi

          cd /tmp/site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "Publish from main @ ${GITHUB_SHA:0:7}"
          git push -f -q \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

          echo "Published ${GITHUB_SHA:0:7} to gh-pages (missing files flag: $missing)"
